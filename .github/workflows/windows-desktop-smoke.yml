name: Windows Desktop Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-desktop-smoke.yml"
      - "scripts/windows-desktop-smoke.ps1"
      - "src-tauri/**"
      - "src/**"
      - "e2e/complete-presurvey-property-sheet-flow.spec.ts"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  windows-installer-smoke:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      - name: Build Windows desktop bundle
        run: pnpm tauri build

      - name: Locate Windows installer
        id: installer
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -Recurse | Select-Object -First 1
          if (!$msi) {
            throw "No MSI installer found under src-tauri/target/release/bundle/msi"
          }
          "msi=$($msi.FullName)" >> $env:GITHUB_OUTPUT

      - name: Smoke installed Windows app
        shell: pwsh
        run: |
          ./scripts/windows-desktop-smoke.ps1 `
            -InstallerPath "${{ steps.installer.outputs.msi }}" `
            -OutputDir "artifacts/smoke/windows-vm"

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Start web fullflow server
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "pnpm.cmd" -ArgumentList "dev" -PassThru
          "pid=$($process.Id)" >> $env:GITHUB_OUTPUT
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:3000" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) {
                exit 0
              }
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          throw "Timed out waiting for http://localhost:3000"

      - name: Run complete product fullflow
        env:
          E2E_BASE_URL: http://localhost:3000
        run: pnpm playwright test e2e/complete-presurvey-property-sheet-flow.spec.ts --reporter=line

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload Windows smoke evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-smoke-evidence
          path: |
            artifacts/smoke/windows-vm/**
            e2e/results/**
          if-no-files-found: error
