name: Tauri Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos-aarch64
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            name: windows-x64
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Ensure Windows temp output directory
        if: runner.os == 'Windows'
        run: New-Item -ItemType Directory -Force D:\tmp

      - name: Test
        run: pnpm test

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: "${{ github.ref_type == 'tag' && github.ref_name || 'aire-v__VERSION__' }}"
          releaseName: "AIRE v__VERSION__"
          releaseBody: "AIRE desktop app installers. Keep this release as draft until macOS and Windows UTM verification pass."
          releaseDraft: true
          prerelease: false
          args: "${{ matrix.args }}"

      - name: Locate Windows installer
        if: runner.os == 'Windows'
        id: windows-installer
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -Recurse | Select-Object -First 1
          if (!$msi) {
            throw "No MSI installer found under src-tauri/target/release/bundle/msi"
          }
          "msi=$($msi.FullName)" >> $env:GITHUB_OUTPUT

      - name: Smoke installed Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/windows-desktop-smoke.ps1 `
            -InstallerPath "${{ steps.windows-installer.outputs.msi }}" `
            -OutputDir "artifacts/smoke/windows-vm"

      - name: Install Playwright browser
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium

      - name: Start web fullflow server
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "pnpm.cmd" -ArgumentList "dev" -PassThru
          "AIRE_E2E_SERVER_PID=$($process.Id)" >> $env:GITHUB_ENV
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:3000" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) {
                exit 0
              }
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          throw "Timed out waiting for http://localhost:3000"

      - name: Run complete product fullflow
        if: runner.os == 'Windows'
        env:
          E2E_BASE_URL: http://localhost:3000
        run: pnpm playwright test e2e/complete-presurvey-property-sheet-flow.spec.ts --reporter=line

      - name: Stop web fullflow server
        if: always() && runner.os == 'Windows' && env.AIRE_E2E_SERVER_PID != ''
        shell: pwsh
        run: Stop-Process -Id $env:AIRE_E2E_SERVER_PID -Force -ErrorAction SilentlyContinue

      - name: Upload Windows smoke evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-smoke-evidence
          path: |
            artifacts/smoke/windows-vm/**
            e2e/results/**
          if-no-files-found: error
