<h1>MOI_API_036門牌查建號服務</h1>
<div class="contentbody">
<div class="dashed_bottom">
<h2 class="color_deepblue">1.以地址查詢：QueryByAddress</h2>

<span class="subtitle">1.1.查詢參數</span>

<table  border="0" cellspacing="1" cellpadding="3"  class="main_table">
	<thead>
	<tr>
		<th>參數名稱</th>
		<th>必選填</th>
		<th>說明</th>
	</tr>
	</thead>
	<tbody>
		<tr>
			<td>CITY</td>
			<td>必填</td>
			<td>縣市代碼，字元長度為1</td>
		</tr>
		<tr>
			<td>ADDRESS</td>
			<td>必填</td>
			<td>地址必須包含縣市名稱、鄉鎮市區、大道/路/街/巷、門牌號(其中段、樓需填寫中文數字)</td>
		</tr>
	</tbody>
</table>
<small>➔單次查詢上限1筆</small>
	
	<p></p>


<span class="subtitle">1.2.輸出欄位</span>


<table  border="0" cellspacing="1" cellpadding="3"  class="main_table">
<caption>建物標示部：BLDGREG</caption>
<thead>
		<tr>
	<th>回傳欄位名稱</th>
	<th>資料欄位中文
</th>
	</tr>
		</thead>
	<tbody>
	<tr>
		<td>UNIT</td>
		<td>地政事務所代碼</td>
	</tr>
	<tr>
		<td>SEC</td>
		<td>段代碼</td>
	</tr>
	<tr>
		<td>NO</td>
		<td>建號</td>
	</tr>
	<tr>
		<td>ADDRESS</td>
		<td>建物門牌</td>
	</tr>
	 
</tbody>
</table>
