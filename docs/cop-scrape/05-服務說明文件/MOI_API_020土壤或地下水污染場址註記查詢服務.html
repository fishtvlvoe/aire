    <body>
 

<h1>MOI_API_020土壤或地下水污染場址註記</h1>
<div class="contentbody">
<div class="dashed_bottom">
<h2 class="color_deepblue">1.以地號查詢：QueryByLandNo</h2>

<span class="subtitle">1.1.查詢參數</span>

<table  border="0" cellspacing="1" cellpadding="3"  class="main_table">
	<thead>
	<tr>
		<th>參數名稱</th>
		<th>必選填</th>
		<th>說明</th>
	</tr>
	</thead>
	<tbody>
		<tr>
		<td>UNIT</td>
		<td>必填</td>
		<td>事務所代碼，字元長度為2</td>
	</tr>
		<tr>
		<td>SEC</td>
		<td>必填</td>
		<td>段代碼，字元長度為4</td>
	</tr>
		<tr>
		<td>NO</td>
		<td>必填</td>
		<td>地號，字元長度為8</td>
	</tr>
	</tbody>
</table>
<small>➔單次查詢上限25筆</small>
	
	<p></p>


<span class="subtitle">1.2.輸出欄位</span>


<table  border="0" cellspacing="1" cellpadding="3"  class="main_table">
<caption>土壤或地下水汙染場址：POLLUTIONSITE</caption>
<thead>
		<tr>
	<th>回傳欄位名稱</th>
	<th>資料欄位中文
</th>
	</tr>
		</thead>
	<tbody>
	<tr>
		<td>POLLUTIONSITE</td>
		<td>土壤或地下水污染場址註記</td>
	</tr>
	</tbody>
</table>
<p></p>
<table  border="0" cellspacing="1" cellpadding="3"  class="main_table">
<caption>土地參考檔：AFLBF</caption>
<thead>
		<tr>
	<th>回傳欄位名稱</th>
	<th>資料欄位中文
</th>
	</tr>
		</thead>
	<tbody>
	<tr>
		<td>CONTENT</td>
		<td>土地汙染資訊內容</td>
	</tr>
	</tbody>
</table>
<small>※土地參考檔[AFLBF]結構下會有多組{CONTENT}
	</small>

 


</div>

</div>
