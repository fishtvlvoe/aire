<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>物件資料總覽 - Workbench Prototype</title>
    <style>
      body { margin: 0; padding: 24px; background: #f6f7f9; color: #17191e; font-family: "Noto Sans TC", sans-serif; font-size: 17px; }
      .shell { max-width: 1600px; margin: 0 auto; }
      .back { color: #6b7280; text-decoration: none; display: inline-block; margin-bottom: 12px; font-size: 17px; }
      .summary, .workspace { background: #fff; border: 1px solid #dadde4; border-radius: 24px; padding: 24px; box-shadow: 0 8px 24px rgba(15,23,42,.04); }
      .summary { margin-bottom: 18px; }
      .summary-line { display:flex; flex-wrap:wrap; gap:12px; align-items:center; line-height:1.6; }
      .summary-line .label, .summary-line .name { font-weight: 900; }
      .summary-line .addr { color:#6b7280; }
      .head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; }
      .badge { border-radius:999px; background:#ecfdf3; color:#067647; padding:8px 12px; font-size:17px; font-weight:800; }
      .tabs { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
      .tab { border:2px solid #1f2937; border-radius:16px; padding:12px 16px; font-weight:900; font-size:17px; background:#fff; }
      .tab.active { background:#16181d; color:#fff; }
      .list { margin-top: 22px; display:grid; gap:16px; }
      .item { display:grid; grid-template-columns: 280px 1fr 220px; gap:18px; border:1px solid #dadde4; border-radius:20px; padding:20px; background:#fff; }
      .item h3 { margin:0 0 8px; font-size:17px; }
      .source { color:#6b7280; line-height:1.7; font-size:17px; }
      .value { font-size:17px; font-weight:800; line-height:1.6; }
      .state { align-self:start; justify-self:end; border-radius:999px; padding:8px 12px; font-weight:800; font-size:17px; }
      .state.formal { background:#ecfdf3; color:#067647; }
      .state.reference { background:#fff8e8; color:#b86902; }
    </style>
  </head>
  <body>
    <div class="shell">
      <a class="back" href="./index.html">← 返回 prototype 清單</a>

      <section class="summary">
        <div class="summary-line">
          <span class="label">物件摘要</span>
          <span class="name">四維路</span>
          <span class="addr">新竹市北區四維路130號4樓之3</span>
        </div>
      </section>

      <section class="workspace">
        <div class="head">
          <div>
            <h2 style="margin:0 0 8px;font-size:17px;">欄位審核</h2>
            <div style="color:#6b7280;font-size:17px;">資料來源、資料等級、待補欄位集中在一頁看清楚。</div>
          </div>
          <div class="badge">正式資料已帶入</div>
        </div>

        <div class="tabs">
          <div class="tab">欄位初審</div>
          <div class="tab">補件與現場</div>
          <div class="tab">正式資料匯入</div>
          <div class="tab active">物件資料總覽</div>
          <div class="tab">PDF 檢查</div>
        </div>

        <div class="list">
          <div class="item">
            <div>
              <h3>土地面積</h3>
              <div class="source">來源：免費前查候選 + 已確認地段地號</div>
            </div>
            <div class="value">66.29 平方公尺</div>
            <div class="state reference">參考版資料</div>
          </div>
          <div class="item">
            <div>
              <h3>公告土地現值 / 公告地價</h3>
              <div class="source">來源：免費前查欄位</div>
            </div>
            <div class="value">公告現值 41,400 ｜ 公告地價 7,700</div>
            <div class="state reference">參考版資料</div>
          </div>
          <div class="item">
            <div>
              <h3>建物權利範圍</h3>
              <div class="source">來源：正式地政查詢</div>
            </div>
            <div class="value">全部 1/1</div>
            <div class="state formal">正式資料</div>
          </div>
          <div class="item">
            <div>
              <h3>登記日期</h3>
              <div class="source">來源：正式地政查詢</div>
            </div>
            <div class="value">民國 102 年 04 月 21 日</div>
            <div class="state formal">正式資料</div>
          </div>
        </div>
      </section>
    </div>
  </body>
  </html>
